<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>CineEnglish</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0e0e;
  --card: #1a1a1a;
  --card2: #242424;
  --border: #2e2e2e;
  --red: #e50914;
  --red-dim: rgba(229,9,20,0.12);
  --text: #ffffff;
  --muted: #888888;
  --success: #46d369;
  --max: 640px;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { background:var(--bg); color:var(--text); font-family:'Nunito',sans-serif; min-height:100vh; }

.app { max-width:var(--max); margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }
.screen { display:none; flex:1; flex-direction:column; }
.screen.active { display:flex; }

/* HEADER */
.header { padding:14px 20px; display:flex; align-items:center; justify-content:space-between; background:rgba(14,14,14,0.96); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:100; }
.logo { font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:1px; }
.logo span { color:var(--red); }
.stats { display:flex; gap:14px; }
.stat { font-size:13px; font-weight:700; }
.stat-fire { color:#ff9500; }
.stat-xp { color:var(--success); }

/* BOTTOM NAV */
.bnav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:var(--max); background:rgba(18,18,18,0.97); backdrop-filter:blur(16px); border-top:1px solid var(--border); display:flex; z-index:200; padding-bottom:env(safe-area-inset-bottom); }
.bnav-btn { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:9px 0 7px; cursor:pointer; border:none; background:none; color:var(--muted); font-family:'Nunito',sans-serif; font-size:10px; font-weight:700; letter-spacing:0.3px; transition:color 0.15s; }
.bnav-btn .ico { font-size:20px; transition:transform 0.15s; }
.bnav-btn.active { color:var(--red); }
.bnav-btn.active .ico { transform:scale(1.2); }

/* ONBOARDING */
.onboard-top { padding:36px 24px 20px; text-align:center; }
.onboard-title { font-family:'Bebas Neue',sans-serif; font-size:56px; line-height:1; }
.onboard-title span { color:var(--red); }
.onboard-sub { color:var(--muted); font-size:15px; margin-top:8px; line-height:1.5; }
.search-row { display:flex; gap:10px; padding:0 20px 16px; }
.search-row input { flex:1; background:var(--card); border:1.5px solid var(--border); border-radius:14px; padding:13px 16px; color:var(--text); font-family:'Nunito',sans-serif; font-size:15px; outline:none; transition:border-color 0.2s; }
.search-row input:focus { border-color:var(--red); }
.search-row input::placeholder { color:var(--muted); }
.btn-red { background:var(--red); color:#fff; border:none; border-radius:14px; padding:13px 18px; font-family:'Nunito',sans-serif; font-size:15px; font-weight:700; cursor:pointer; white-space:nowrap; transition:opacity 0.2s; }
.btn-red:active { opacity:0.8; }
.section-label { padding:0 20px 10px; font-size:11px; font-weight:700; color:var(--muted); letter-spacing:1px; text-transform:uppercase; }
.section-label em { color:var(--red); font-style:normal; }
.movie-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 20px; }
.movie-tile { border-radius:14px; overflow:hidden; background:var(--card); border:2px solid transparent; cursor:pointer; position:relative; aspect-ratio:2/3; transition:border-color 0.2s, transform 0.15s; }
.movie-tile:active { transform:scale(0.97); }
.movie-tile img { width:100%; height:100%; object-fit:cover; display:block; }
.tile-info { position:absolute; bottom:0; left:0; right:0; background:linear-gradient(transparent,rgba(0,0,0,0.88)); padding:24px 10px 10px; }
.tile-title { font-size:12px; font-weight:700; line-height:1.2; }
.tile-year { font-size:11px; color:var(--muted); }
.movie-tile.sel { border-color:var(--red); }
.movie-tile.sel::after { content:'✓'; position:absolute; top:8px; right:8px; background:var(--red); color:#fff; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; line-height:22px; text-align:center; }
.onboard-foot { padding:16px 20px; position:sticky; bottom:0; background:linear-gradient(transparent, var(--bg) 40%); padding-top:32px; }
.btn-start { width:100%; background:var(--red); color:#fff; border:none; border-radius:16px; padding:17px; font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:1px; cursor:pointer; opacity:0.35; transition:opacity 0.2s; pointer-events:none; }
.btn-start.on { opacity:1; pointer-events:all; }

/* CONTENT */
.content-body { flex:1; overflow-y:auto; padding:16px 20px 90px; }

/* CARD */
.ccard { background:var(--card); border-radius:16px; border:1px solid var(--border); overflow:hidden; margin-bottom:14px; }
.ccard-inner { padding:20px; }
.badge { display:inline-flex; align-items:center; gap:5px; background:var(--red-dim); color:var(--red); font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; margin-bottom:14px; }
.film-tag { font-size:12px; color:var(--muted); margin-bottom:14px; display:flex; align-items:center; gap:6px; }
.film-tag img { width:20px; height:30px; object-fit:cover; border-radius:4px; }

/* BLUR */
.blur-box { background:var(--card2); border-radius:12px; padding:14px; cursor:pointer; position:relative; user-select:none; }
.blur-box .b-label { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:7px; }
.blur-box .b-text { filter:blur(7px); transition:filter 0.25s; font-size:14px; line-height:1.6; color:#ddd; }
.blur-box .b-hint { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--muted); font-weight:700; border-radius:12px; transition:opacity 0.25s; }
.blur-box.open .b-text { filter:none; }
.blur-box.open .b-hint { opacity:0; pointer-events:none; }

/* OPTIONS */
.opts { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px; }
.opt { background:var(--card2); border:1.5px solid var(--border); border-radius:12px; padding:12px 10px; color:var(--text); font-family:'Nunito',sans-serif; font-size:13px; font-weight:600; cursor:pointer; text-align:center; line-height:1.3; transition:all 0.15s; }
.opt:active:not(:disabled) { transform:scale(0.96); }
.opt.ok { background:rgba(70,211,105,0.15); border-color:var(--success); color:var(--success); }
.opt.no { background:rgba(229,9,20,0.15); border-color:var(--red); color:var(--red); }

/* KEYWORDS */
.kw-list { display:flex; flex-direction:column; gap:8px; margin-top:14px; }
.kw-item { background:var(--card2); border-radius:12px; padding:12px 14px; }
.kw-word { font-size:15px; font-weight:700; color:var(--red); margin-bottom:3px; }
.kw-def { font-size:13px; color:var(--muted); line-height:1.4; }

/* CHARACTER */
.char-head { display:flex; gap:14px; align-items:center; margin-bottom:14px; }
.char-emo { width:60px; height:60px; border-radius:14px; background:var(--card2); border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:28px; flex-shrink:0; }
.char-name { font-family:'Bebas Neue',sans-serif; font-size:26px; line-height:1; margin-bottom:3px; }
.char-actor { font-size:13px; color:var(--muted); }
.char-role { display:inline-block; background:var(--red-dim); color:var(--red); font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; margin-top:4px; }
.char-bio { font-size:14px; line-height:1.7; color:#ddd; margin-bottom:14px; }
.fact-box { background:var(--card2); border-radius:12px; padding:14px; border-left:3px solid var(--red); }
.fact-label { font-size:11px; font-weight:700; color:var(--red); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px; }
.fact-text { font-size:13px; color:var(--muted); line-height:1.5; }

/* DIALOG */
.dialog-lines { display:flex; flex-direction:column; gap:10px; margin-bottom:14px; }
.dline { display:flex; gap:10px; }
.dsp { font-size:11px; font-weight:700; color:var(--red); min-width:56px; padding-top:2px; }
.dtxt { font-size:14px; line-height:1.5; }
.phrases { display:flex; flex-direction:column; gap:8px; margin-top:14px; }
.phrase { background:var(--card2); border-radius:12px; padding:12px 14px; }
.phrase-en { font-size:14px; font-weight:700; margin-bottom:2px; }
.phrase-ru { font-size:12px; color:var(--muted); }

/* NEXT BTN */
.next-wrap { padding:0 0 8px; }
.btn-next { width:100%; background:var(--card); border:1.5px solid var(--border); border-radius:14px; padding:14px; color:var(--text); font-family:'Nunito',sans-serif; font-size:15px; font-weight:700; cursor:pointer; transition:border-color 0.2s; display:flex; align-items:center; justify-content:center; gap:8px; }
.btn-next:hover { border-color:var(--red); }

/* YT */
.yt-link { display:inline-flex; align-items:center; gap:5px; color:var(--red); font-size:12px; font-weight:700; text-decoration:none; margin-top:14px; }

/* LOADING */
.loading-wrap { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 20px; gap:14px; }
.spinner { width:28px; height:28px; border:2px solid var(--border); border-top-color:var(--red); border-radius:50%; animation:spin 0.65s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.loading-txt { color:var(--muted); font-size:14px; text-align:center; line-height:1.5; }

/* XP TOAST */
.toast { position:fixed; top:68px; left:50%; transform:translateX(-50%) translateY(-8px); background:rgba(70,211,105,0.18); border:1px solid var(--success); color:var(--success); padding:7px 18px; border-radius:20px; font-size:14px; font-weight:700; opacity:0; transition:all 0.25s; z-index:999; pointer-events:none; white-space:nowrap; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* ERROR */
.err-wrap { background:rgba(229,9,20,0.08); border:1px solid rgba(229,9,20,0.3); border-radius:14px; padding:20px; text-align:center; }
.err-txt { color:var(--red); font-size:13px; margin-bottom:14px; line-height:1.5; }
</style>
</head>
<body>
<div class="app">
<div class="toast" id="toast"></div>

<!-- ONBOARDING -->
<div class="screen active" id="s-onboard">
  <div class="onboard-top">
    <div class="onboard-title">CINE<span>ENGLISH</span></div>
    <div class="onboard-sub">Pick 3+ movies — we'll teach you real English from them</div>
  </div>
  <div class="search-row">
    <input id="q" type="text" placeholder="Search any movie or series..." />
    <button class="btn-red" onclick="doSearch()">Go</button>
  </div>
  <div id="search-out" style="padding:0 20px 12px;display:grid;grid-template-columns:1fr 1fr;gap:10px;"></div>
  <div class="section-label">🔥 Trending — <em id="sel-cnt">0</em>/3 selected</div>
  <div class="movie-grid" id="trending-out"></div>
  <div class="onboard-foot">
    <button class="btn-start" id="btn-start" onclick="startApp()">START LEARNING →</button>
  </div>
</div>

<!-- APP -->
<div class="screen" id="s-app">
  <div class="header">
    <div class="logo">CINE<span>EN</span></div>
    <div class="stats">
      <div class="stat stat-fire">🔥 <span id="h-streak">0</span></div>
      <div class="stat stat-xp">⚡ <span id="h-xp">0</span> XP</div>
    </div>
  </div>

  <div class="content-body" id="content-body">
    <div class="loading-wrap"><div class="spinner"></div><div class="loading-txt">Loading...</div></div>
  </div>

  <nav class="bnav">
    <button class="bnav-btn active" data-tab="guess" onclick="switchTab('guess',this)"><span class="ico">🎬</span>GUESS</button>
    <button class="bnav-btn" data-tab="scene" onclick="switchTab('scene',this)"><span class="ico">🎭</span>SCENE</button>
    <button class="bnav-btn" data-tab="char" onclick="switchTab('char',this)"><span class="ico">🦸</span>CHARACTER</button>
    <button class="bnav-btn" data-tab="dialog" onclick="switchTab('dialog',this)"><span class="ico">💬</span>DIALOG</button>
  </nav>
</div>

</div>
<script>
const TMDB = 'b2c8da3269c07162a4d94f45d34569a6';
const GROQ_KEY = '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';

let selected = [];
let currentTab = 'guess';
let xp = +localStorage.getItem('ce_xp') || 0;
let streak = +localStorage.getItem('ce_streak') || 0;
let lastDay = localStorage.getItem('ce_day') || '';

function saveStats() {
  localStorage.setItem('ce_xp', xp);
  localStorage.setItem('ce_streak', streak);
  localStorage.setItem('ce_day', lastDay);
  document.getElementById('h-xp').textContent = xp;
  document.getElementById('h-streak').textContent = streak;
}
saveStats();

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

function addXP(n) {
  xp += n;
  const today = new Date().toDateString();
  if (lastDay !== today) { lastDay = today; streak++; }
  saveStats();
  showToast('+' + n + ' XP');
}

// TMDB
async function tmdb(path) {
  const r = await fetch('https://api.themoviedb.org/3' + path + (path.includes('?') ? '&' : '?') + 'api_key=' + TMDB + '&language=en-US');
  return r.json();
}
const img = (p, s='w300') => p ? 'https://image.tmdb.org/t/p/' + s + p : '';

// GROQ
async function groq(prompt) {
  const r = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + GROQ_KEY },
    body: JSON.stringify({
      model: 'llama-3.3-70b-versatile',
      messages: [{ role: 'user', content: prompt }],
      max_tokens: 900,
      temperature: 0.6
    })
  });
  const d = await r.json();
  if (d.error) throw new Error(d.error.message);
  return d.choices[0].message.content;
}

function parseJSON(raw) {
  let s = raw.replace(/```json|```/g, '').trim();
  // extract first { ... } block
  const start = s.indexOf('{');
  const end = s.lastIndexOf('}');
  if (start !== -1 && end !== -1) s = s.slice(start, end + 1);
  // remove trailing commas
  s = s.replace(/,(\s*[}\]])/g, '$1');
  return JSON.parse(s);
}

// TRENDING
async function loadTrending() {
  const d = await tmdb('/trending/movie/week?');
  const movies = (d.results || []).filter(m => m.poster_path).slice(0, 4);
  document.getElementById('trending-out').innerHTML = movies.map(m =>
    makeTile(m.id, m.title || m.name, m.poster_path, (m.release_date||'').slice(0,4))
  ).join('');
}

function makeTile(id, title, poster, year) {
  const safe = title.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  const safep = poster || '';
  return `<div class="movie-tile" id="tile-${id}" onclick="toggleMovie(${id},'${safe}','${safep}','${year}')">
    <img src="${img(poster)}" alt="${safe}" loading="lazy">
    <div class="tile-info"><div class="tile-title">${title}</div><div class="tile-year">${year}</div></div>
  </div>`;
}

function toggleMovie(id, title, poster, year) {
  const el = document.getElementById('tile-' + id);
  const idx = selected.findIndex(m => m.id === id);
  if (idx > -1) { selected.splice(idx, 1); el.classList.remove('sel'); }
  else if (selected.length < 8) { selected.push({id, title, poster, year}); el.classList.add('sel'); }
  document.getElementById('sel-cnt').textContent = selected.length;
  const btn = document.getElementById('btn-start');
  btn.classList.toggle('on', selected.length >= 3);
}

// SEARCH
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

async function doSearch() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  const out = document.getElementById('search-out');
  out.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:12px"><div class="spinner" style="margin:auto"></div></div>';
  try {
    const d = await tmdb('/search/multi?query=' + encodeURIComponent(q));
    const items = (d.results||[]).filter(r => (r.media_type==='movie'||r.media_type==='tv') && r.poster_path).slice(0,4);
    if (!items.length) { out.innerHTML = '<p style="color:var(--muted);font-size:13px;grid-column:1/-1;padding:8px">Nothing found</p>'; return; }
    out.innerHTML = items.map(m => {
      const title = m.title || m.name;
      const year = (m.release_date || m.first_air_date || '').slice(0,4);
      return makeTile(m.id, title, m.poster_path, year);
    }).join('');
  } catch(e) {
    out.innerHTML = '<p style="color:var(--red);font-size:13px;grid-column:1/-1">' + e.message + '</p>';
  }
}

function startApp() {
  if (selected.length < 3) return;
  document.getElementById('s-onboard').classList.remove('active');
  document.getElementById('s-app').classList.add('active');
  loadTab('guess');
}

// TAB SWITCH
function switchTab(name, btn) {
  currentTab = name;
  document.querySelectorAll('.bnav-btn').forEach(b => b.classList.toggle('active', b === btn));
  loadTab(name);
}

function randMovie() {
  return selected[Math.floor(Math.random() * selected.length)];
}

async function loadTab(tab) {
  const body = document.getElementById('content-body');
  const m = randMovie();
  body.innerHTML = `<div class="loading-wrap"><div class="spinner"></div><div class="loading-txt">Generating for <strong>${m.title}</strong>…</div></div>`;
  try {
    if (tab === 'guess') await renderGuess(m, body);
    else if (tab === 'scene') await renderScene(m, body);
    else if (tab === 'char') await renderChar(m, body);
    else if (tab === 'dialog') await renderDialog(m, body);
  } catch(e) {
    body.innerHTML = `<div style="padding:20px"><div class="err-wrap"><div class="err-txt">${e.message}</div><button class="btn-red" onclick="loadTab('${tab}')">Try again</button></div></div>`;
  }
}

function filmTag(m) {
  return `<div class="film-tag">${m.poster ? `<img src="${img(m.poster,'w92')}" alt="">` : ''}${m.title} · ${m.year}</div>`;
}

function nextBtn(tab) {
  return `<div class="next-wrap"><button class="btn-next" onclick="loadTab('${tab}')">↻ Next question</button></div>`;
}

// GUESS
async function renderGuess(m, body) {
  const raw = await groq(
    `Create a "guess the quote" English learning card for the movie or series "${m.title}" (${m.year}).
Return ONLY a JSON object with these exact keys:
{
  "quote": "a famous or iconic English quote from this movie/series (no apostrophes, use double quotes style avoided, rewrite contractions: do not instead of don't)",
  "translation": "Russian translation of the quote",
  "correct": "correct Russian translation (same as translation, short version max 6 words)",
  "wrong1": "wrong Russian option, plausible but incorrect, max 6 words",
  "wrong2": "wrong Russian option, plausible but incorrect, max 6 words",
  "wrong3": "wrong Russian option, plausible but incorrect, max 6 words"
}
IMPORTANT: Return ONLY the JSON object. No markdown. No extra text.`
  );
  const d = parseJSON(raw);
  const options = shuffle([d.correct, d.wrong1, d.wrong2, d.wrong3]);
  const ytq = encodeURIComponent(m.title + ' best scene');

  body.innerHTML = `
  <div class="ccard-inner">
    ${filmTag(m)}
    <div class="badge">🎬 GUESS THE QUOTE</div>
    <div class="ccard">
      <div class="ccard-inner">
        <div style="font-size:18px;font-weight:700;line-height:1.5;font-style:italic;margin-bottom:10px">"${d.quote}"</div>
        <div class="blur-box" id="tr-box" onclick="this.classList.add('open')">
          <div class="b-label">Translation</div>
          <div class="b-text">${d.translation}</div>
          <div class="b-hint">👆 Tap to reveal</div>
        </div>
        <div class="opts" id="opts">
          ${options.map(o => `<button class="opt" onclick="answerGuess(this,'${o.replace(/'/g,"\\'")}','${d.correct.replace(/'/g,"\\'")}','guess')">${o}</button>`).join('')}
        </div>
        <a class="yt-link" href="https://youtube.com/results?search_query=${ytq}" target="_blank">▶ Watch on YouTube</a>
      </div>
    </div>
    ${nextBtn('guess')}
  </div>`;
}

function answerGuess(btn, chosen, correct, tab) {
  document.querySelectorAll('#opts .opt').forEach(b => {
    b.disabled = true;
    if (b.textContent.trim() === correct) b.classList.add('ok');
  });
  if (chosen === correct) { btn.classList.add('ok'); addXP(20); }
  else { btn.classList.add('no'); }
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// SCENE
async function renderScene(m, body) {
  const raw = await groq(
    `Create a scene breakdown English learning card for the movie or series "${m.title}" (${m.year}).
Return ONLY a JSON object:
{
  "quote": "a famous English quote from this movie (no apostrophes, rewrite contractions)",
  "translation": "Russian translation of the quote",
  "word1": "first key English word from the quote",
  "def1": "simple English definition of word1, max 12 words",
  "word2": "second key English word from the quote",
  "def2": "simple English definition of word2, max 12 words",
  "word3": "third key English word or phrase from the quote",
  "def3": "simple English definition of word3, max 12 words"
}
IMPORTANT: Return ONLY the JSON object. No markdown. No extra text.`
  );
  const d = parseJSON(raw);
  const ytq = encodeURIComponent(m.title + ' famous quote scene');

  body.innerHTML = `
  <div class="ccard-inner">
    ${filmTag(m)}
    <div class="badge">🎭 SCENE BREAKDOWN</div>
    <div class="ccard">
      <div class="ccard-inner">
        <div style="font-size:17px;font-weight:700;line-height:1.5;font-style:italic;border-left:3px solid var(--red);padding-left:12px;margin-bottom:14px">"${d.quote}"</div>
        <div class="blur-box" onclick="this.classList.add('open');addXP(5)">
          <div class="b-label">Russian Translation</div>

          <div class="b-hint">👆 Tap to reveal</div>
        </div>
        <div class="kw-list">
          <div class="kw-item"><div class="kw-word">${d.word1}</div><div class="kw-def">${d.def1}</div></div>
          <div class="kw-item"><div class="kw-word">${d.word2}</div><div class="kw-def">${d.def2}</div></div>
          <div class="kw-item"><div class="kw-word">${d.word3}</div><div class="kw-def">${d.def3}</div></div>
        </div>
        <a class="yt-link" href="https://youtube.com/results?search_query=${ytq}" target="_blank">▶ Watch on YouTube</a>
      </div>
    </div>
    ${nextBtn('scene')}

}

  const raw = await groq(
    `Create a character biography English learning card for a character from "${m.title}" (${m.year}).
Choose a different character each time (not always the main hero).
Return ONLY a JSON object:
{
  "name": "Character full name",
  "actor": "Actor real name",
  "role": "Hero or Villain or Supporting or Antihero",
  "emoji": "one emoji representing this character",
  "bio": "2 sentences biography in English describing the character personality and story. No apostrophes.",
  "fact": "One interesting real behind-the-scenes fact about filming this character. No apostrophes."
}
IMPORTANT: Return ONLY the JSON object. No markdown. No extra text.`
  );
  const d = parseJSON(raw);

  body.innerHTML = `
  <div class="ccard-inner">
    ${filmTag(m)}
    <div class="badge">🦸 CHARACTER</div>
    <div class="ccard">
      <div class="ccard-inner">
        <div class="char-head">
          <div class="char-emo">${d.emoji || '🎭'}</div>
          <div>
            <div class="char-name">${d.name}</div>
            <div class="char-actor">Played by ${d.actor}</div>
            <div class="char-role">${d.role}</div>
          </div>
        </div>
        <div class="char-bio">${d.bio}</div>
        <div class="fact-box">
          <div class="fact-label">🎬 Behind the scenes</div>
          <div class="fact-text">${d.fact}</div>
        </div>
      </div>
    </div>
    ${nextBtn('char')}
  </div>`;
  addXP(5);
}

    `Create a dialog breakdown English learning card from the movie or series "${m.title}" (${m.year}).
Return ONLY a JSON object:
{
  "speaker1": "Character 1 name",
  "line1": "English dialog line 1, max 10 words, no apostrophes",
  "speaker2": "Character 2 name",
  "line2": "English dialog line 2, max 10 words, no apostrophes",
  "speaker1b": "Character 1 name again",
  "line3": "English dialog line 3, max 10 words, no apostrophes",
  "translation": "Russian translation of the full dialog in 2-3 lines",
  "phrase1": "key English phrase from dialog",
  "meaning1": "Russian meaning of phrase1",
  "phrase2": "key English phrase from dialog",
  "meaning2": "Russian meaning of phrase2",
  "phrase3": "key English phrase from dialog",
  "meaning3": "Russian meaning of phrase3"
}
IMPORTANT: Return ONLY the JSON object. No markdown. No extra text.`
  );
  const d = parseJSON(raw);

      <div class="ccard-inner">

          <div class="dline"><div class="dsp">${d.speaker2}:</div><div class="dtxt">"${d.line2}"</div></div>
          <div class="dline"><div class="dsp">${d.speaker1b}:</div><div class="dtxt">"${d.line3}"</div></div>
        </div>
        <div class="blur-box" onclick="this.classList.add('open');addXP(5)">
          <div class="b-label">Russian Translation</div>
          <div class="b-text">${d.translation}</div>
          <div class="b-hint">👆 Tap to reveal</div>
        </div>
        <div class="phrases">
          <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin:14px 0 8px">Key Phrases</div>
          <div class="phrase"><div class="phrase-en">"${d.phrase1}"</div><div class="phrase-ru">${d.meaning1}</div></div>
          <div class="phrase"><div class="phrase-en">"${d.phrase2}"</div><div class="phrase-ru">${d.meaning2}</div></div>

    </div>
    ${nextBtn('dialog')}
  </div>`;
}
